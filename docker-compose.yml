version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend API Gateway
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crowdeye-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DEBUG=False
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - FRONTEND_URL=https://crowdeye-ai.vercel.app,http://localhost:3000,http://localhost:5500
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - crowdeye-network

  # ---------------------------------------------------------------------------
  # 2. Dedicated AI Inference Worker (YOLOv8 + DeepSORT)
  # Separated from FastAPI server
  # ---------------------------------------------------------------------------
  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: crowdeye-ai-worker
    depends_on:
      - backend
    environment:
      - API_BASE_URL=http://backend:8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_KEY}
      - AI_DEVICE=cpu
      - DEMO_MODE=${DEMO_MODE:-false}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - crowdeye-network

# Database remains: Supabase Managed Cloud Service (No local database container created)
networks:
  crowdeye-network:
    driver: bridge
